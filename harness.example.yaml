version: 1

runtime:
  mode: managed
  minimumClaudeCodeVersion: 2.1.220

scope:
  registry: global

validation:
  repetitions: 3
  requireAllDevelopmentCases: true
  requireAllValidationCases: true
  requireAllRegressionCases: true
  requireAllHoldoutCases: true
  autoPromote: true
  credentialEnvironmentVariable: HARNESS_VALIDATION_API_KEY
  readUserClaudeLogin: false

evolution:
  runAfterStop: true
  disableEnvironmentVariable: HARNESS_AUTO_EVOLVE

recall:
  defaultTokenBudget: 2048
  exposeExperienceStatuses: [usable]
  exposeSkillStatuses: [completed]
  recordFeedback: true

project:
  packageManager: auto
  testCommand: auto
  buildCommand: auto

isolation:
  type: git-worktree
  requireCleanFixture: true
  inheritEnvironment: false
  network: disabled

collection:
  prompts: redacted
  finalResponses: redacted
  toolInputs: redacted
  toolOutputs: summary
  fileDiffs: redacted
  environmentVariables: deny
